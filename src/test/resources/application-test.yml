spring:
  autoconfigure:
    exclude:
      - com.google.cloud.spring.autoconfigure.bigquery.GcpBigQueryAutoConfiguration
      - com.google.cloud.spring.autoconfigure.storage.GcpStorageAutoConfiguration
  cloud:
    gcp:
      project-id: test-project
      credentials:
        enabled: false
      bigquery:
        enabled: false
      storage:
        enabled: false
      sql:
        enabled: false
  datasource:
    url: jdbc:h2:mem:test
aims:
  epochs: 107|108|109
  max-records-per-job: 5
  min-records-per-job: 2
  pubsub:
    error-topic: aims-ids-error
